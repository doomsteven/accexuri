<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coming Soon</title>
<meta name="description" content="Muy pronto.">
<link rel="icon" href="data:,">

<!-- model-viewer: web component ligero (lazy-loads su propio runtime) para render 3D con WebGL, sin necesidad de escribir código Three.js a mano -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js" async></script>

<style>
  :root{
    --bg: #ddde00;
    --ink: #171717;
    --muted: #4a4a00;
    --accent: #171717;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background:var(--bg);
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink);
  }

  .stage{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* Fondo: gradiente sutil radial para dar profundidad sin pesar */
  .bg-glow{
    position:absolute;
    inset:0;
    background:
      radial-gradient(60% 50% at 50% 42%, #ffffff 0%, var(--bg) 70%);
    z-index:0;
  }

  model-viewer{
    position:relative;
    z-index:1;
    width:min(1100px, 92vw);
    height:min(1100px, 92vh);
    --poster-color: transparent;
    background-color: transparent;
    outline:none;
  }

  /* Placeholder mientras no exista el .glb: figura suave para que la página
     nunca se vea "rota" antes de conectar el modelo real */
  .fallback-shape{
    position:absolute;
    z-index:1;
    width:min(420px, 55vw);
    height:min(420px, 55vw);
    border-radius:50%;
    background: conic-gradient(from 220deg, #ececea, #ffffff, #e4e4e1, #ffffff, #ececea);
    filter: blur(0.5px);
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.12),
      inset 0 0 60px rgba(255,255,255,0.6);
    animation: float 6s ease-in-out infinite;
    display:none;
  }

  @keyframes float{
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-18px); }
  }

  .mark{
    position:absolute;
    left:50%;
    bottom:9vh;
    transform:translateX(-50%);
    z-index:2;
    text-align:center;
    pointer-events:none;
  }

  .mark .label{
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight:600;
  }

  .mark .rule{
    width:36px;
    height:1px;
    background: var(--muted);
    margin: 14px auto 0;
    opacity:0.7;
  }

  @media (max-width: 640px){
    .mark{ bottom:7vh; }
  }

  @media (prefers-reduced-motion: reduce){
    .fallback-shape{ animation:none; }
  }
</style>
</head>
<body>

<section class="stage">
  <div class="bg-glow"></div>

  <div class="fallback-shape" id="fallbackShape"></div>

  <model-viewer
    id="model"
    src="assets/models/model.glb"
    alt="Modelo 3D"
    camera-controls
    disable-zoom
    disable-pan
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="16deg"
    interaction-prompt="none"
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1.15"
    environment-image="neutral"
    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"
    loading="eager"
    reveal="auto"
  ></model-viewer>

  <div class="mark">
    <div class="label">Coming Soon</div>
    <div class="rule"></div>
  </div>
</section>

<script>
  const viewer = document.getElementById('model');
  const fallback = document.getElementById('fallbackShape');

  // Si el .glb aún no existe o falla al cargar, mostramos el placeholder
  // en su lugar para que la landing nunca se vea vacía o rota.
  viewer.addEventListener('error', () => {
    viewer.style.display = 'none';
    fallback.style.display = 'block';
  });
</script>

</body>
</html>
